[project]
name = "mcreval"
version = "0.1.0"
description = "Point Cloud Manhole Center Regression Evaluation Pipeline"
authors = [
  { name="Tobia Ippolito" }
]
readme = "README.md"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "open3d",
    "h5py",
    "scikit-learn",
    "scipy"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# [tool.setuptools.packages.find]
# where = ["."]

[tool.setuptools]
packages = ["mcreval"]

[project.scripts]
mcreval = "mcreval.evaluate:main"


